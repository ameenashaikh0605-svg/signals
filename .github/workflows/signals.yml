name: Buy/Sell signals

on:
  schedule:
    # GitHub starts free scheduled runs only every 1-2 hours, so each run keeps checking every
    # 5 minutes for ~5h45m; a scheduled run that fires meanwhile waits and carries on after it.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Kolkata
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      US_TELEGRAM_BOT_TOKEN: ${{ secrets.US_TELEGRAM_BOT_TOKEN }}
      CRYPTO_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}   # only checked for being set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Telegram test
        if: ${{ inputs.test_telegram }}
        run: python cloud_scan.py --test-telegram
      - name: Check the markets every 5 minutes
        if: ${{ !inputs.test_telegram }}
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 345 * 60 ))
          while :; do
            python cloud_scan.py || echo "scan failed, trying again next round"
            # every 30 minutes: live swing checks (entry / target / stop alerts); US only while its market is open
            if [ $(( 10#$(date +%M) % 30 )) -lt 5 ]; then
              git pull --rebase --autostash -q || git rebase --abort || true   # pick up the after-close run's US state first
              python swing_scan.py us --live || echo "US live check failed"
              python swing_scan.py crypto --live || echo "crypto live check failed"
            fi
            for f in cloud_state.json risk_today.json signals_log.csv us_state.json crypto_state.json; do [ -f "$f" ] && git add "$f"; done; true
            if ! git diff --cached --quiet; then
              git commit -q -m "Save signal state [skip ci]"
              for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            fi
            # wait until 20 seconds after the next 5-minute mark, so the 5-minute candle has closed
            now=$(date +%s); next=$(( (now / 300 + 1) * 300 + 20 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - now ))
          done
